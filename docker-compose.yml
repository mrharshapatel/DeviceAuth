services:
  mysql:
    image: mysql:8.0
    container_name: deviceauth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: deviceauth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./deviceauth-backend
      dockerfile: Dockerfile
    container_name: deviceauth-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/deviceauth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: VGhpc0lzQURldk9ubHlTZWNyZXRLZXlGb3JEZXZpY2VBdXRoMjAyNg==
    depends_on:
      - mysql

volumes:
  mysql_data:
