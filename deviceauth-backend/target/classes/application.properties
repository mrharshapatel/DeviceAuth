spring.application.name=deviceauth
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/deviceauth_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
# Use a strong Base64-encoded secret of at least 32 bytes in an environment variable for real deployments.
deviceauth.jwt.secret=${JWT_SECRET:VGhpc0lzQURldk9ubHlTZWNyZXRLZXlGb3JEZXZpY2VBdXRoMjAyNg==}
deviceauth.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
