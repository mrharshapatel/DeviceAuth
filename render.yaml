services:
  # 1. Spring Boot Backend (Java 21 + Tomcat)
  - type: web
    name: deviceauth-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/auth/login
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # 2. React Vite Frontend (Static Site)
  - type: web
    name: deviceauth-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd deviceauth-frontend && npm install && npm run build
    staticPublishPath: ./deviceauth-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
