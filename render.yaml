services:
  - type: web
    name: deviceauth-backend
    runtime: docker
    dockerfilePath: ./deviceauth-backend/Dockerfile
    dockerContext: ./deviceauth-backend
    plan: free
    region: oregon
    healthCheckPath: /api/auth/login
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
